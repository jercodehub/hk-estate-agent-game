<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地產佬日常：香港樓市生存記 v2</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "PingFang HK", "Microsoft JhengHei", sans-serif; background: #1a1a2e; color: #eee; line-height: 1.5; }
.container { max-width: 900px; margin: 15px auto; padding: 15px; background: #16213e; border-radius: 12px; }
h1 { text-align: center; color: #e94560; font-size: 1.6em; margin-bottom: 5px; }
.day { text-align: center; color: #00d9ff; font-size: 1.1em; margin: 5px 0 15px; }
.stats { display: flex; justify-content: space-around; background: #0f3460; padding: 12px; border-radius: 8px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
.stat { text-align: center; min-width: 90px; }
.stat span { font-weight: bold; color: #00d9ff; font-size: 1.1em; }
#main { background: #0f3460; padding: 15px; border-radius: 8px; min-height: 200px; }
.deal-card { background: #1a1a2e; border: 1px solid #e94560; border-radius: 8px; padding: 12px; margin: 10px 0; }
.deal-card h3 { color: #ffd700; margin-bottom: 5px; }
.tag { display: inline-block; background: #e94560; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.85em; margin-right: 5px; }
.tag.rent { background: #00d9ff; color: #000; }
.tag.big { background: #ffd700; color: #000; }
.tag.small { background: #888; }
.tag.hard { background: #ff6b6b; }
button { background: #e94560; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; margin: 5px 5px 5px 0; font-size: 15px; }
button:hover { background: #c73e54; }
button:disabled { background: #555; cursor: not-allowed; }
.result { margin-top: 10px; color: #00d9ff; }
.hidden { display: none; }
</style>
</head>
<body>
<div class="container">
<h1>地產佬日常：香港樓市生存記</h1>
<div class="day" id="day">第 1 日 / 10</div>
<div class="stats">
<div class="stat">金錢<br><span id="money">0</span></div>
<div class="stat">聲譽<br><span id="rep">50</span></div>
<div class="stat">風險<br><span id="risk">0</span></div>
<div class="stat">精力<br><span id="energy">3</span>/3</div>
</div>
<div id="main"></div>
<button id="nextBtn" class="hidden" onclick="nextDay()">下一日</button>
</div>

<script>
let day = 1;
const maxDay = 10;
let money = 0;
let rep = 50;
let risk = 0;
let energy = 3;
const maxEnergy = 3;

const districts = [
  { name: "沙田", trait: "家庭客多，重視學校同管理費" },
  { name: "觀塘", trait: "舊樓多，漏水、石屎問題常見" },
  { name: "將軍澳", trait: "新盤多，交樓延遲風險，投資客多" },
  { name: "大角咀", trait: "租客流動大，隔音差常見" },
  { name: "北角", trait: "大手同自住混合，管理費較貴" },
  { name: "太古", trait: "高淨值客多，要求高" },
  { name: "屯門", trait: "價錢較低，家庭客為主" },
  { name: "元朗", trait: "首次置業多，交通係重點" },
  { name: "黃大仙", trait: "舊樓漏水多" },
  { name: "九龍塘", trait: "豪宅大手多" }
];

const dealTemplates = [
  // 買樓
  { type: "buy", client: "small", title: "散戶買居屋自住", energy: 2, baseMoney: 3500, defect: "僧建（封左露台）", choices: [
    { text: "誠實提醒僧建", money: 1500, rep: 12, risk: 0, result: "客人欣賞誠實，雖然最後唔買，但聲譽升。" },
    { text: "隐瞞僧建", money: 3500, rep: -18, risk: 8, result: "成交，但客人入住後被查，來責怪你。" },
    { text: "叫業主先拆僧建", money: 2200, rep: 8, risk: -2, result: "業主同意拆，客人滿意買下。" }
  ]},
  { type: "buy", client: "big", title: "大手投資買新盤", energy: 2, baseMoney: 8000, defect: "交樓可能延遲", choices: [
    { text: "收回佣，優先推", money: 12000, rep: -12, risk: 5, result: "大手買下兩伙，你收到額外佣金，但業內有人話你。" },
    { text: "公平推薦，拒絕回佣", money: 6000, rep: 15, risk: 0, result: "客人覺得你專業，聲譽大升。" },
    { text: "提醒交樓風險", money: 5000, rep: 10, risk: 0, result: "客人欣賞你提醒，仲係買咗。" }
  ]},
  { type: "buy", client: "hard", title: "難搞客買二手洋樓", energy: 3, baseMoney: 5000, defect: "管理費高 + 天台漏水記錄", choices: [
    { text: "誠實講全部問題", money: 3000, rep: 10, risk: 0, result: "客人雖然對不停，但仲係買咗，聲譽升。" },
    { text: "講問題已解決", money: 5500, rep: -10, risk: 6, result: "成交，但後來客人發現問題未解決。" },
    { text: "建議放棄，再睇其他", money: 1000, rep: 5, risk: 0, result: "客人聽你建議，轉去睇第二間。" }
  ]},
  // 租樓
  { type: "rent", client: "small", title: "散戶租舊樓", energy: 1, baseMoney: 1800, defect: "輕微漏水", choices: [
    { text: "誠實話有漏水", money: 800, rep: 10, risk: 0, result: "客人欣賞誠實，仲係租咗。" },
    { text: "唔講，話單位幾好", money: 2000, rep: -15, risk: 7, result: "快速簽約，但三日後發現漏水，來投訴。" },
    { text: "建議再睇多一間", money: 0, rep: 5, risk: 0, result: "客人覺得你對佢好。" }
  ]},
  { type: "rent", client: "small", title: "家庭租三房", energy: 1, baseMoney: 1600, defect: "隔音差", choices: [
    { text: "提醒隔音問題", money: 700, rep: 8, risk: 0, result: "客人欣賞提醒，雖然唔租。" },
    { text: "唔講隔音", money: 1700, rep: -12, risk: 5, result: "租咗，一星期後投訴你隐瞞。" },
    { text: "建議睇其他地區", money: 500, rep: 3, risk: 0, result: "客人同意再睇。" }
  ]},
  { type: "rent", client: "big", title: "大手租住宅", energy: 2, baseMoney: 4000, defect: "管理費高", choices: [
    { text: "誠實講管理費", money: 3000, rep: 8, risk: 0, result: "客人接受，成交。" },
    { text: "講管理費值得", money: 4500, rep: -5, risk: 3, result: "成交，但客人後來覺得你話大話。" },
    { text: "推薦其他單位", money: 2000, rep: 5, risk: 0, result: "客人聽你建議。" }
  ]}
];

function updateStats() {
  document.getElementById("day").textContent = `第 ${day} 日 / ${maxDay}`;
  document.getElementById("money").textContent = money;
  document.getElementById("rep").textContent = Math.max(0, Math.min(100, rep));
  document.getElementById("risk").textContent = risk;
  document.getElementById("energy").textContent = energy;
}

function generateDeals() {
  const num = 2 + Math.floor(Math.random() * 2); // 2-3 deals
  const deals = [];
  for (let i = 0; i < num; i++) {
    const t = dealTemplates[Math.floor(Math.random() * dealTemplates.length)];
    const d = districts[Math.floor(Math.random() * districts.length)];
    deals.push({
      ...t,
      district: d.name,
      trait: d.trait,
      id: i
    });
  }
  return deals;
}

let currentDeals = [];

function showDay() {
  if (day > maxDay) {
    endGame();
    return;
  }
  energy = maxEnergy;
  currentDeals = generateDeals();
  updateStats();
  renderDeals();
  document.getElementById("nextBtn").classList.add("hidden");
}

function renderDeals() {
  const main = document.getElementById("main");
  let html = `<p>今日精力：<strong>${energy}</strong> 點。以下是今日可跟進的 deal：</p>`;
  currentDeals.forEach((deal, idx) => {
    const typeTag = deal.type === "buy" ? '<span class="tag">買樓</span>' : '<span class="tag rent">租樓</span>';
    let clientTag = "";
    if (deal.client === "big") clientTag = '<span class="tag big">大手</span>';
    else if (deal.client === "small") clientTag = '<span class="tag small">散戶</span>';
    else clientTag = '<span class="tag hard">難搞</span>';
    html += `
      <div class="deal-card" id="deal-${idx}">
        <h3>${typeTag} ${clientTag} ${deal.district} — ${deal.title}</h3>
        <p>地區特性：${deal.trait}</p>
        <p>已知問題：${deal.defect}</p>
        <p>消耗精力：${deal.energy} 點</p>
        <div id="choices-${idx}"></div>
      </div>
    `;
  });
  main.innerHTML = html;

  currentDeals.forEach((deal, idx) => {
    const choicesDiv = document.getElementById(`choices-${idx}`);
    deal.choices.forEach(choice => {
      const btn = document.createElement("button");
      btn.textContent = choice.text;
      btn.onclick = () => handleChoice(idx, choice);
      choicesDiv.appendChild(btn);
    });
  });
}

function handleChoice(idx, choice) {
  const deal = currentDeals[idx];
  if (energy < deal.energy) {
    alert("精力唔夠！");
    return;
  }
  energy -= deal.energy;
  money += choice.money;
  rep += choice.rep;
  risk += choice.risk;
  if (rep < 0) rep = 0;
  if (rep > 100) rep = 100;

  const card = document.getElementById(`deal-${idx}`);
  card.innerHTML = `
    <h3>${deal.district} — ${deal.title}</h3>
    <div class="result"><strong>結果：</strong> ${choice.result}<br>金錢 ${choice.money >= 0 ? "+" : ""}${choice.money} | 聲譽 ${choice.rep >= 0 ? "+" : ""}${choice.rep} | 風險 ${choice.risk >= 0 ? "+" : ""}${choice.risk}</div>
  `;

  updateStats();

  // Check if any energy left or all done
  const remaining = document.querySelectorAll(".deal-card button").length;
  if (energy <= 0 || remaining === 0) {
    document.getElementById("nextBtn").classList.remove("hidden");
  }
}

function nextDay() {
  day++;
  showDay();
}

function endGame() {
  let ending = "";
  if (rep >= 75 && risk <= 10) ending = "你成為受客戶尊敬的良心經紀，雖然賺得唔算最多，但口碑很好，生意穩定，公司仲想提你做經理。";
  else if (money >= 40000 && risk >= 15) ending = "你賺得袋袋安全，但聲譽差，客戶投訴多，公司開始警告你，你要小心佢地查你。";
  else if (risk >= 25 || rep <= 20) ending = "風險太高，聲譽太差，最後被多個客戶聯合投訴，你被公司辭退。";
  else if (money >= 25000 && rep >= 50) ending = "你平衡地做經紀，賺到不錯佣金，聲譽中上，繼續在香港樓市生存下去。";
  else ending = "你做咗一陣地產佬，賺到一定錢，聲譽一般，仲係繼續做下去。";

  document.getElementById("main").innerHTML = `
    <h2>游戲結束</h2>
    <p>總共做咗 ${maxDay} 日地產佬。</p>
    <p>最終金錢：${money} 元</p>
    <p>最終聲譽：${rep}</p>
    <p>最終風險：${risk}</p>
    <p style="margin-top:15px;">${ending}</p>
  `;
  document.getElementById("nextBtn").classList.add("hidden");
  const restart = document.createElement("button");
  restart.textContent = "再玩一次";
  restart.onclick = () => location.reload();
  document.getElementById("main").appendChild(restart);
}

updateStats();
showDay();
</script>
</body>
</html>
